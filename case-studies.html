<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Studies — Nestyin Connect</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body class="case-studies-page" data-view="all">
  <header class="navbar">
    <a class="logo" href="index.html">NESTYIN<span>CONNECT</span></a>
    <nav>
      <a href="index.html">Explore</a>
      <a class="active" href="case-studies.html">Case Studies</a>
      <a href="projects.html">Projects</a>
      <a href="contribute-case-study.html">Contribute</a>
      <a href="contact.html?type=feedback">Feedback</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">CASE STUDIES</div>
        <h1>Find a case study.</h1>
        <div class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="text" placeholder="Search case studies, skills...">
        </div>
      </div>
    </section>

    <section class="section" id="case-studies">
      <div class="section-header">
        <div>
          <div class="section-label purple">CASE STUDIES</div>
          <h1>All Case Studies</h1>
        </div>
      </div>
      <div class="case-browser">
        <aside class="project-filter-sidebar">
          <div class="filter-sidebar-heading">Filter case studies</div>
          <div class="project-filter-bar" id="projectFilterBar"></div>
        </aside>
        <div class="project-results">
          <div class="project-results-summary">Browse case studies by tag, company, or target role.</div>
          <div class="cards" id="caseStudyCards"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="logo">NESTYIN<span>CONNECT</span></div>
    <p>Real problems. Real skills. Real feedback.</p>
  </footer>

  <script src="app.js?v=9"></script>
</body>
</html>
