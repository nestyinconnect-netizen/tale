<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solve Case Study — Nestyin Connect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">NESTYIN<span>CONNECT</span></a>
    <nav>
      <a href="index.html">Explore</a>
      <a class="active" href="case-study.html">Case Studies</a>
      <a href="index.html#projects">Projects</a>
    </nav>
  </header>

  <main class="application-page">
    <div class="application-header">
      <div class="section-label purple">CASE STUDY APPLICATION</div>
      <h1>Submit your solution</h1>
      <p>Scaling a cloud Platform</p>
    </div>

    <form id="applicationForm" class="application-form">
      <input type="hidden" name="type" value="case_study">
      <input type="hidden" name="caseId" id="caseId">
      <input type="hidden" name="projectId" value="">
      <input type="hidden" name="project" value="Scaling a cloud Platform">

      <div class="form-grid">
        <label>
          Name
          <input name="name" type="text" autocomplete="name" required>
        </label>
        <label>
          Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>
          Total years of experience
          <input name="experience" type="text" placeholder="e.g. 5 years" required>
        </label>
        <label>
          Target role / level
          <select name="targetLevel" required>
            <option value="">Select level</option>
            <option value="Junior / SE2">Junior / SE2</option>
            <option value="Mid / SE3">Mid / SE3</option>
            <option value="Senior">Senior</option>
            <option value="Staff">Staff</option>
            <option value="Principal">Principal</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <label>
          Target position title
          <input name="targetPosition" type="text" placeholder="e.g. Senior Software Engineer" required>
        </label>
        <label>
          Evaluation type
          <select name="evaluationType" required>
            <option value="General expert review">General expert review</option>
            <option value="Microsoft">Microsoft</option>
            <option value="Google">Google</option>
            <option value="Amazon">Amazon</option>
            <option value="Other professional">Other professional</option>
          </select>
        </label>
        <label>
          Evaluation focus area
          <input name="domain" type="text" placeholder="e.g. Backend, Cloud, Data, Platform, Security" required>
        </label>
      </div>

      <label>
        Resume link
        <input name="resume" type="url" placeholder="https://drive.google.com/..." required>
      </label>
      <label>
        Solution link
        <input name="solution" type="url" placeholder="https://1drv.ms/..." required>
      </label>

      <p class="form-note">Use share links for your resume and solution. Files are not uploaded to this website.</p>
      <button class="primary submit-button" type="submit">Submit Solution</button>
      <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer>
    <div class="logo">NESTYIN<span>CONNECT</span></div>
    <p>Real problems. Real skills. Real feedback.</p>
  </footer>

  <script src="application.js"></script>
</body>
</html>
