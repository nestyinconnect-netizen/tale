<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Opportunities — Nestyin Connect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="all">
  <header class="navbar">
    <a class="logo" href="index.html">NESTYIN<span>CONNECT</span></a>
    <nav>
      <a href="index.html">Explore</a>
      <a href="view-all.html#case-studies">Case Studies</a>
      <a href="view-all.html#projects">Projects</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">ALL OPPORTUNITIES</div>
        <h1>Explore.<br><span>Build. Solve. Grow.</span></h1>
        <p>Browse every case study and project opportunity.</p>
        <div class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="text" placeholder="Search opportunities, skills...">
        </div>
      </div>
    </section>

    <section class="content">
      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="case">Case Studies</button>
        <button class="filter" data-filter="project">Projects</button>
        <button class="filter" data-filter="public">Public</button>
        <button class="filter" data-filter="private">Private</button>
      </div>
    </section>

    <section class="section" id="case-studies">
      <div class="section-header">
        <div>
          <div class="section-label purple">CASE STUDIES</div>
          <h2>All case studies</h2>
        </div>
      </div>
      <div class="cards" id="caseStudyCards"></div>
    </section>

    <section class="section" id="projects">
      <div class="section-header">
        <div>
          <div class="section-label green">PROJECTS</div>
          <h2>All projects</h2>
        </div>
      </div>
      <div class="cards" id="projectCards"></div>
    </section>
  </main>

  <footer>
    <div class="logo">NESTYIN<span>CONNECT</span></div>
    <p>Real problems. Real skills. Real feedback.</p>
  </footer>

  <script src="app.js?v=3"></script>
</body>
</html>
