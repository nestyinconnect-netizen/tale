<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply — Nestyin Connect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">NESTYIN<span>CONNECT</span></a>
    <nav>
      <a href="index.html">Explore</a>
      <a href="case-study.html">Case Studies</a>
      <a class="active" href="index.html#projects">Projects</a>
    </nav>
  </header>

  <main class="application-page">
    <div class="application-header">
      <div class="section-label green">PROJECT APPLICATION</div>
      <h1>Apply to this project</h1>
      <p id="opportunityName">Loading project...</p>
    </div>

    <form id="applicationForm" class="application-form">
      <input type="hidden" name="type" id="opportunityType">
      <input type="hidden" name="projectId" id="projectId">
      <input type="hidden" name="project" id="projectName">

      <div class="form-grid">
        <label>Name<input name="name" type="text" autocomplete="name" required></label>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
        <label>Experience<input name="experience" type="text" placeholder="e.g. 5 years" required></label>
        <label>Current or previous company<input name="company" type="text" autocomplete="organization"></label>
        <label>Skills<input name="skills" type="text" placeholder="e.g. Backend, AWS, System Design" required></label>
      </div>

      <label>Resume link<input name="resume" type="url" placeholder="https://drive.google.com/..." required></label>
      <label>Solution or portfolio link<input name="solution" type="url" placeholder="https://1drv.ms/..." required></label>
      <p class="form-note">Use share links for your resume and solution. Files are not uploaded to this website.</p>
      <button class="primary submit-button" type="submit">Submit Application</button>
      <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer>
    <div class="logo">NESTYIN<span>CONNECT</span></div>
    <p>Real problems. Real skills. Real feedback.</p>
  </footer>

  <script src="application.js"></script>
</body>
</html>
